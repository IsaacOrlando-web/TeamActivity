<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Product Detail</title>

  <link rel="stylesheet" href="/css/style.css" />
  <script src="../js/product.js" type="module"></script>
</head>

<body>
  <header id="main-header" class="divider"></header>

  <main class="divider">
    <section class="product-detail__content">
      <div class="product-detail__image">
        <picture>
          <source media="(min-width: 1281px)" srcset="">
          <source media="(min-width: 769px) and (max-width: 1280px)" srcset="">
          <source media="(max-width: 768px)" srcset="">
          <img id="productImage" src="" alt="" loading="lazy">
        </picture>
      </div>

      <div class="product-detail__info">
        <h2 id="productBrand" class="product-card__brand"></h2>
        <h3 id="productName" class="divider"></h3>
        <p id="productPrice" class="product-card__price"></p>
        <p id="productColor" class="product__color"></p>
        <p id="productDesc" class="product__description"></p>
        <div class="product-detail__add">
          <button id="addToCart" data-id="">Add to Cart</button>
        </div>
      </div>
    </section>
  </main>

  <footer id="main-footer"></footer>
</body>

</html>
